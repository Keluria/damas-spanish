name: Verify development victory preview

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  victory-preview:
    name: Check isolated victory in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install browser test tooling without changing the lockfile
        run: npm install --no-save --package-lock=false playwright@1.65.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-victory-browser.mjs
      - name: Keep screenshots and celebration video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: victory-preview
          path: work/victory-preview/
          if-no-files-found: ignore
