<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#234e46" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="description" content="Damas españolas accesibles para dos personas. Juega con calma, también sin conexión." />
  <link rel="icon" href="/damas-spanish/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/damas-spanish/apple-touch-icon.png" />
  <title>Damas Españolas</title>
</head>
<body>
  <main>
    <section class="game" aria-label="Partida de damas">
      <div id="play-area">
        <div class="turn" aria-live="polite" aria-atomic="true"><span id="turn-piece" aria-hidden="true"></span><div><h2 id="status" tabindex="-1"></h2><p id="hint"></p></div></div>
        <div id="board" class="board" role="group" aria-label="Tablero de ocho filas y ocho columnas"></div>
      </div>
      <section id="result" class="result" aria-labelledby="result-title" hidden>
        <div id="result-stars" class="result-stars" aria-hidden="true" hidden><span>✦</span><span>✦</span><span>✦</span><span>✦</span><span>✦</span></div>
        <h1 id="result-title" tabindex="-1" aria-describedby="result-message"></h1>
        <p id="result-message"></p>
      </section>
      <p id="save-status" class="save" role="status" hidden></p>
    </section>
    <div class="actions"><button id="restart">Nueva partida</button></div>
  </main>
  <dialog id="restart-dialog" aria-labelledby="restart-title"><h2 id="restart-title">¿Empezar una partida nueva?</h2><p>Se borrará la partida actual.</p><form method="dialog"><button value="cancel" autofocus>Seguir jugando</button><button value="restart" class="secondary">Empezar de nuevo</button></form></dialog>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
